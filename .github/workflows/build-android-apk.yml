name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release?'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install Web Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🏗️ Build Vite Frontend
        run: npm run build

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK Environment & Licenses
        run: |
          echo "Using preinstalled Android SDK at: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "platform-tools" || true

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 🔑 Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: ⚡ Build Debug APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Prepare APK Assets & Checksum
        id: prepare_apk
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ] || [ "$VERSION_TAG" = "master" ]; then
            VERSION_TAG="${{ github.event.inputs.tag_name || 'latest' }}"
          fi
          
          OUTPUT_DIR="android/app/build/outputs/apk/debug"
          APK_NAME="Universal-Video-Downloader-${VERSION_TAG}.apk"
          SHA_NAME="${APK_NAME}.sha256"
          
          if [ -f "$OUTPUT_DIR/app-debug.apk" ]; then
            cp "$OUTPUT_DIR/app-debug.apk" "$OUTPUT_DIR/$APK_NAME"
            (cd "$OUTPUT_DIR" && sha256sum "$APK_NAME" > "$SHA_NAME")
            
            echo "apk_path=$OUTPUT_DIR/$APK_NAME" >> $GITHUB_OUTPUT
            echo "sha_path=$OUTPUT_DIR/$SHA_NAME" >> $GITHUB_OUTPUT
            echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
            echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
            echo "Successfully prepared $APK_NAME and $SHA_NAME"
          else
            echo "Error: app-debug.apk not found!"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi

      - name: 💾 Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Video-Downloader-APK
          path: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            ${{ steps.prepare_apk.outputs.sha_path }}
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version_tag }}
          name: "Universal Video Downloader ${{ steps.prepare_apk.outputs.version_tag }}"
          body: |
            ### 📱 Universal Video & Audio Downloader APK Release (${{ steps.prepare_apk.outputs.version_tag }})
            
            আমাদের ইউনিভার্সাল ভিডিও ও অডিও ডাউনলোডার অ্যান্ড্রয়েড অ্যাপটির অফিশিয়াল রিলিজ প্রস্তুত!
            
            #### 🌟 প্রধান সুবিধাসমূহ (Key Features):
            - **Universal Downloader**: YouTube, TikTok (নো-ওয়াটারমার্ক), Facebook Reels, Instagram, Twitter/X সরাসরি ডাউনলোড।
            - **MicroSD Card & Phone Storage**: সরাসরি মেমোরি কার্ড বা ফোন মেমোরিতে ফাইল সেভ করার অপশন (`MANAGE_EXTERNAL_STORAGE`)।
            - **Android Window Overlay**: অন্যান্য অ্যাপের উপর দিয়ে শর্টকাট ডাউনলোড বাটন (`SYSTEM_ALERT_WINDOW`)।
            - **Background Keep-Alive**: স্ক্রিন বন্ধ বা মিনিমাইজ রাখলেও ডাউনলোড সচল থাকে ও নোটিফিকেশন প্রদর্শন করে।
            - **Google Sign-In & Cloud Sync**: গুগল অ্যাকাউন্ট দিয়ে ডাউনলোড হিস্টোরি ক্লাউডে সিঙ্ক করার সুবিধা।
            - **Android Share Target**: যেকোনো সোশ্যাল মিডিয়া অ্যাপ থেকে সরাসরি 'Share' করে ডাউনলোড করুন।
            - **0 MB Fix & Health Monitor**: ফাইল সাইজ শূন্য হওয়ার সমস্যা স্বয়ংক্রিয়ভাবে শনাক্ত ও সমাধান।
            
            #### 📲 অ্যান্ড্রয়েড ফোনে ইনস্টল করার নিয়ম (Installation Guide):
            1. নিচের `Universal-Video-Downloader-*.apk` ফাইলটি সরাসরি আপনার অ্যান্ড্রয়েড ফোনে ডাউনলোড করুন।
            2. ডাউনলোড শেষে ফাইলে ট্যাপ করে ইনস্টল শুরু করুন।
            3. যদি ফোন সিস্টেম সতর্কতা দেখায়, তবে **"Settings"**-এ গিয়ে **"Allow from this source"** বা **"Install unknown apps"** অনুমতি দিন।
            4. ইনস্টল সম্পন্ন হলে অ্যাপটি ওপেন করে ড্রাইভ পারমিশন অনুমোদন করুন।
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            ${{ steps.prepare_apk.outputs.sha_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
